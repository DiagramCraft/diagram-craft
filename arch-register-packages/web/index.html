<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const readTheme = () => {
            const state = JSON.parse(localStorage.getItem('diagram-craft.user-state') ?? '{}');
            if (state.themeMode === 'light' || state.themeMode === 'dark') return state.themeMode;
            const legacyTheme = localStorage.getItem('ar-theme');
            if (legacyTheme === 'light' || legacyTheme === 'dark') return legacyTheme;
            return null;
          };
          const isPublicCatalog =
            window.location.pathname === '/public' || window.location.pathname.startsWith('/public/');
          const storedTheme = readTheme();
          const theme =
            storedTheme ??
            (isPublicCatalog && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : isPublicCatalog
                ? 'light'
                : 'dark');
          const root = document.documentElement;
          root.classList.remove('dark', 'dark-theme', 'light-theme');
          if (theme === 'light') {
            root.setAttribute('data-theme', 'light');
            root.classList.add('light-theme');
          } else {
            root.removeAttribute('data-theme');
            root.classList.add('dark', 'dark-theme');
          }
        } catch {
          /* Keep the static dark fallback when storage or media queries are unavailable. */
        }
      })();
    </script>
    <title>Arch Register</title>
    <style>
      /* Shown only in the demo build, until React replaces the contents of #root */
      #demo-loading {
        display: none;
      }
      #root[data-demo='true'] #demo-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #9a9a9a;
        background: #1a1a1a;
      }
      html[data-theme='light'] #root[data-demo='true'] #demo-loading {
        color: #666;
        background: #fff;
      }
      #demo-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(128, 128, 128, 0.3);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: demo-spin 0.8s linear infinite;
      }
      @keyframes demo-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" data-demo="%VITE_DEMO_MODE%">
      <div id="demo-loading" role="status">
        <div class="spinner"></div>
        <div>Loading the Arch Register demo…</div>
        <div id="demo-loading-detail">Preparing the in-browser server and sample data</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
