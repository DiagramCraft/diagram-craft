packages:
  - './packages/**'
  - './submodules/**'
  - './arch-register-packages/**'
  - './examples/**'
  - './docs-site'

allowBuilds:
  '@openrouter/sdk': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  argon2: true
  better-sqlite3: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - app-builder-lib@26.13.0
  - builder-util-runtime@9.6.3
  - builder-util@26.13.0
  - dmg-builder@26.13.0
  - electron-builder-squirrel-windows@26.13.0
  - electron-builder@26.13.0
  - electron-publish@26.13.0

overrides:
  # 0.12.6 requires @tanstack/ai ^0.66.0; keep the OpenAI adapter on its 0.65-compatible minimum.
  '@tanstack/openai-base': 0.12.4
  '@types/node': 26.4.0
  ws: ^8.20.1
  braces: ^3.0.3
  micromatch: ^4.0.8
  nanoid: ^3.3.18
  postcss: ">=8.5.18"
  esbuild: ^0.25.0
  form-data: ">=4.0.6"
  axios: 1.20.0
  ip-address: 10.7.1
  brace-expansion: 5.0.12
  follow-redirects: ">=1.16.0"
  tar: ">=7.5.19"
  "body-parser@1": 1.20.6
  fast-uri: 3.1.8
  markdown-it: 14.3.1
  linkify-it: 5.0.2
  shell-quote: 1.11.0
  svgo: 3.3.5
  '@hono/node-server': 2.0.10
  hono: 4.13.7
  webpack-dev-server: 5.2.6
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  undici: 7.29.1
  "@xmldom/xmldom": 0.8.15
  "joi@17": 17.13.8
  "joi@18": 18.2.9
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  http-cache-semantics: 4.3.0
  "postcss-selector-parser@^7": 7.1.6
  qs: 6.16.0
  colord: 2.9.4
  image-size: 2.0.3
  "@tootallnate/once": ">=3.0.1"
  defu: ">=6.1.6"
  lodash: ">=4.18.1"
  lodash-es: ">=4.18.1"
  serialize-javascript: 7.0.5
  uuid: 11.1.1
