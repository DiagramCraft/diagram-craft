packages:
  - './packages/**'
  - './submodules/**'
  - './arch-register-packages/**'
  - './examples/**'
  - './docs-site'

allowBuilds:
  '@openrouter/sdk': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  argon2: true
  better-sqlite3: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - app-builder-lib@26.13.0
  - builder-util-runtime@9.6.3
  - builder-util@26.13.0
  - dmg-builder@26.13.0
  - electron-builder-squirrel-windows@26.13.0
  - electron-builder@26.13.0
  - electron-publish@26.13.0

overrides:
  ws: ^8.20.1
  braces: ^3.0.3
  micromatch: ^4.0.8
  nanoid: ^3.3.18
  postcss: ">=8.5.18"
  esbuild: ^0.25.0
  form-data: ">=4.0.6"
  axios: 1.18.0
  ip-address: 10.3.1
  brace-expansion: 5.0.9
  follow-redirects: ">=1.16.0"
  tar: ">=7.5.19"
  "body-parser@1": 1.20.6
  fast-uri: 3.1.5
  linkify-it: 5.0.2
  shell-quote: 1.9.0
  svgo: 3.3.4
  '@hono/node-server': 2.0.10
  hono: 4.12.34
  webpack-dev-server: 5.2.6
  "js-yaml@3": 3.15.1
  "js-yaml@4": 4.3.1
  undici: 7.29.0
  "@xmldom/xmldom": 0.8.13
  "@tootallnate/once": ">=3.0.1"
  defu: ">=6.1.6"
  lodash: ">=4.18.1"
  lodash-es: ">=4.18.1"
  serialize-javascript: 7.0.5
  uuid: 11.1.1
